<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFS Hackathon | Admin Submission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body class="admin-body auth-checking">
    <div class="grid-overlay"></div>
    <header class="dashboard-topbar">
      <div class="container nav-wrap">
        <a class="brand" href="admin.html" aria-label="Admin dashboard">
          <span class="brand-mark">C</span>
          <span>CFS Hackathon</span>
        </a>
        <div class="topbar-actions">
          <a class="btn btn-ghost" href="admin.html">Back to Dashboard</a>
          <button id="adminLogoutBtn" class="btn btn-ghost" type="button">Logout</button>
        </div>
      </div>
    </header>

    <main class="container detail-page">
      <section class="admin-header card">
        <div class="detail-header">
          <div>
            <span class="eyebrow">Team submission</span>
            <h1>Submission Details</h1>
          </div>
          <div id="detailStatus"></div>
        </div>
      </section>

      <div id="detailContent" class="detail-grid"></div>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script type="module" src="./js/admin-submission.js"></script>
  </body>
</html>
